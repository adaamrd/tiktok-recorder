          def fmt_srt_time(seconds):
              seconds = max(0, int(seconds))
              return f"{seconds//3600:02d}:{(seconds%3600)//60:02d}:{seconds%60:02d},000"

          def start_chat_thread(u):
              from TikTokLive import TikTokLiveClient
              from TikTokLive.events import CommentEvent, GiftEvent, LikeEvent, RoomUserSeqEvent, LinkMicArmiesEvent
              st = state[u]

              def run_loop():
                  while not st["stopped"] and not stop_requested:
                      try:
                          loop = asyncio.new_event_loop()
                          asyncio.set_event_loop(loop)
                          client = TikTokLiveClient(unique_id=f"@{u}")

                          @client.on(CommentEvent)
                          async def on_comment(event: CommentEvent):
                              with st["lock"]:
                                  if st["srt"] and st["start"]:
                                      elapsed = max(0, int(time.time() - st["start"]))
                                      st["cnt"] += 1
                                      nick = getattr(event.user, "nickname", "User")
                                      text = clean_emojis(getattr(event, "comment", ""))
                                      with open(st["srt"], "a", encoding="utf-8") as f:
                                          f.write(f"{st['cnt']}\n{fmt_srt_time(elapsed)} --> {fmt_srt_time(elapsed+4)}\n[{nick}]: {text}\n\n")
                                      st["events"].append({"t": elapsed, "type": "chat", "u": nick, "c": text})
                                      if st["json"] and st["cnt"] % 5 == 0:
                                          with open(st["json"], "w", encoding="utf-8") as jf:
                                              json.dump(st["events"], jf, ensure_ascii=False)

                          @client.on(GiftEvent)
                          async def on_gift(event: GiftEvent):
                              with st["lock"]:
                                  if st["start"]:
                                      if getattr(event.gift, "streakable", False) and not getattr(event, "repeat_end", True):
                                          return
                                      elapsed = max(0, int(time.time() - st["start"]))
                                      nick = getattr(event.user, "nickname", "User")
                                      gname = getattr(event.gift, "name", "Gift")
                                      cnt = getattr(event, "repeat_count", 1)
                                      d_cnt = getattr(event.gift, "diamond_count", 0) * cnt
                                      st["events"].append({"t": elapsed, "type": "gift", "u": nick, "c": f"🎁 أرسل {gname} x{cnt}", "d": d_cnt})

                          @client.on(LinkMicArmiesEvent)
                          async def on_pk_points(event: LinkMicArmiesEvent):
                              with st["lock"]:
                                  if st["start"] and (time.time() - st["last_pk"] > 4):
                                      st["last_pk"] = time.time()
                                      elapsed = max(0, int(time.time() - st["start"]))
                                      try:
                                          items = list(getattr(event, "battle_items", {}).values())
                                          if len(items) >= 2:
                                              s1 = getattr(items[0], "total_score", 0)
                                              s2 = getattr(items[1], "total_score", 0)
                                              st["events"].append({"t": elapsed, "type": "pk", "l": int(s1), "r": int(s2)})
                                      except Exception:
                                          pass

                          @client.on(RoomUserSeqEvent)
                          async def on_viewers(event: RoomUserSeqEvent):
                              with st["lock"]:
                                  if st["start"] and (time.time() - st["last_stats"] > 12):
                                      st["last_stats"] = time.time()
                                      elapsed = max(0, int(time.time() - st["start"]))
                                      v = getattr(event, "m_total", 0)
                                      sups = []
                                      try:
                                          for r in getattr(event, "ranks", [])[:4]:
                                              sn = getattr(r.user, "nickname", "")
                                              if sn: sups.append(sn)
                                      except Exception:
                                          pass
                                      if v or sups:
                                          st["events"].append({"t": elapsed, "type": "stats", "v": str(v) if v else "", "sup": sups})

                          @client.on(LikeEvent)
                          async def on_likes(event: LikeEvent):
                              with st["lock"]:
                                  if st["start"] and (time.time() - st["last_likes"] > 15):
                                      st["last_likes"] = time.time()
                                      elapsed = max(0, int(time.time() - st["start"]))
                                      tot = getattr(event, "total_likes", 0)
                                      if tot:
                                          st["events"].append({"t": elapsed, "type": "stats", "l": str(tot)})

                          client.run()
                      except Exception:
                          time.sleep(15)

              t = threading.Thread(target=run_loop, daemon=True)
              t.start()

          def start_guest_hunter_thread():
              if not COOKIE_JAR:
                  return
              from curl_cffi import requests as cf_requests
              headers = {
                  "Accept": "application/json, text/plain, */*",
                  "Referer": "https://www.tiktok.com/live"
              }
              endpoints = [
                  {"aid": "1988", "app_name": "tiktok_web", "device_platform": "web_pc", "channel_id": "42", "req_from": "webapp_following"},
                  {"aid": "1988", "app_name": "tiktok_web", "device_platform": "web_pc", "channel_id": "86", "req_from": "pc_web_following_live"},
                  {"aid": "1988", "app_name": "tiktok_web", "device_platform": "web_pc", "channel_id": "21", "req_from": "feed_following"}
              ]

              def hunter_loop():
                  while not stop_requested:
                      try:
                          radar_stats["scans"] += 1
                          active_guest_hosts = set()
                          with cf_requests.Session(impersonate="chrome", headers=headers, cookies=COOKIE_JAR, timeout=15) as sess:
                              pr = sess.get("https://www.tiktok.com/passport/web/account/info/?aid=1988")
                              if pr.status_code == 200:
                                  pdata = pr.json().get("data") or {}
                                  radar_stats["cookie_ok"] = bool(pdata.get("user_id") or pdata.get("user_id_str") or pdata.get("username"))
                              else:
                                  radar_stats["cookie_ok"] = False

                              for params in endpoints:
                                  r = sess.get("https://webcast.tiktok.com/webcast/feed/", params=params)
                                  if r.status_code != 200 or not r.content:
                                      continue
                                  items = r.json().get("data") or []
                                  radar_stats["rooms"] += len(items)
                                  for item in items:
                                      room = item.get("data") or item.get("room") or item
                                      if not isinstance(room, dict):
                                          continue
                                      owner = room.get("owner") or {}
                                      host_id = str(owner.get("display_id") or owner.get("unique_id") or "").strip().lower()
                                      if not host_id or host_id in CORE_TARGETS:
                                          continue
                                      blobs = [
                                          room.get("link_mic"),
                                          room.get("linker_detail"),
                                          room.get("multi_live"),
                                          room.get("social_interaction"),
                                          item.get("extra"),
                                          item.get("live_reason"),
                                          item.get("recommend_reason"),
                                          item.get("flare_info")
                                      ]
                                      dump_str = " ".join(json.dumps(b, ensure_ascii=False).lower() for b in blobs if b)
                                      for t_user in CORE_TARGETS:
                                          if f'"{t_user}"' in dump_str or f"@{t_user}" in dump_str:
                                              radar_stats["guests"] += 1
                                              active_guest_hosts.add(host_id)
                                              init_user_worker(host_id, guest_of=t_user)

                          for gh in list(guest_host_label.keys()):
                              if gh not in active_guest_hosts:
                                  guest_miss_count[gh] = guest_miss_count.get(gh, 0) + 1
                                  if guest_miss_count[gh] >= 3 and gh in state and not state[gh]["stopped"]:
                                      state[gh]["stopped"] = True
                                      graceful_stop(state[gh]["proc"])
                      except Exception as e:
                          radar_stats["last_err"] = type(e).__name__
                      time.sleep(45)

              th = threading.Thread(target=hunter_loop, daemon=True)
              th.start()

          for u in list(USERS):
              init_user_worker(u)

          start_guest_hunter_thread()

          start_global = time.time()

          while time.time() - start_global < MAX_SECONDS and not stop_requested:
              for u in list(USERS):
                  st = state[u]
                  if st["stopped"]:
                      continue
                  u_dir = st["dir"]
                  if st["proc"].poll() is not None:
                      cmd = [
                          os.path.expanduser("~/.local/bin/uv"), "run", "python", "src/main.py",
                          "-user", u, "-mode", "automatic", "-automatic_interval", "1", "-output", u_dir
                      ]
                      st["proc"] = subprocess.Popen(cmd, cwd="tiktok-live-recorder", start_new_session=True)

                  flvs = glob.glob(os.path.join(u_dir, "*_flv.mp4"))
                  if flvs:
                      latest_flv = max(flvs, key=os.path.getmtime)
                      cur_size = os.path.getsize(latest_flv)
                      if latest_flv != st["active_flv"]:
                          with st["lock"]:
                              st["active_flv"] = latest_flv
                              st["last_size"] = cur_size
                              st["last_growth"] = time.time()
                              base_name = latest_flv.replace("_flv.mp4", "")
                              st["srt"] = base_name + ".srt"
                              st["json"] = base_name + ".json"
                              st["start"] = time.time()
                              st["cnt"] = 0
                              st["events"] = []
                              with open(st["srt"], "w", encoding="utf-8") as f:
                                  f.write("")
                      else:
                          if cur_size > st["last_size"]:
                              st["last_size"] = cur_size
                              st["last_growth"] = time.time()
                          if cur_size >= 1800000000 or (cur_size > 2000000 and (time.time() - st["last_growth"] > 180)):
                              graceful_stop(st["proc"])
                              base_prefix = st["active_flv"].replace("_flv.mp4", "")
                              with st["lock"]:
                                  if st["json"] and st["events"]:
                                      with open(st["json"], "w", encoding="utf-8") as jf:
                                          json.dump(st["events"], jf, ensure_ascii=False)
                              async_upload_stream(u, base_prefix)
                              st["active_flv"] = None

                  mp4s = [
                      f for f in glob.glob(os.path.join(u_dir, "*.mp4"))
                      if not f.endswith("_flv.mp4") and os.path.getsize(f) > 2000000
                  ]
                  for mp4 in mp4s:
                      base_prefix = mp4.replace(".mp4", "")
                      if base_prefix not in st["uploaded"] and base_prefix not in st["uploading"]:
                          with st["lock"]:
                              if st["json"] and st["events"]:
                                  with open(st["json"], "w", encoding="utf-8") as jf:
                                      json.dump(st["events"], jf, ensure_ascii=False)
                          async_upload_stream(u, base_prefix)

              time.sleep(5)

          for u in list(USERS):
              st = state[u]
              st["stopped"] = True
              graceful_stop(st["proc"])
              with st["lock"]:
                  if st["json"] and st["events"]:
                      with open(st["json"], "w", encoding="utf-8") as jf:
                          json.dump(st["events"], jf, ensure_ascii=False)
              for raw in glob.glob(os.path.join(st["dir"], "*_flv.mp4")):
                  bp = raw.replace("_flv.mp4", "")
                  if bp not in st["uploaded"]:
                      upload_stream_prefix(u, bp)
              for mp4 in glob.glob(os.path.join(st["dir"], "*.mp4")):
                  if not mp4.endswith("_flv.mp4"):
                      bp = mp4.replace(".mp4", "")
                      if bp not in st["uploaded"]:
                          upload_stream_prefix(u, bp)
          EOF
          PYTHONPATH=. ./tiktok-live-recorder/.venv/bin/python manager.py

      - name: Finalize Remaining Streams & Trigger Next Run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os, glob, time, json, subprocess
          from datetime import datetime, timedelta
          from ui_builder import parse_srt, parse_ass, write_ass, build_html, generate_sprite_sheet

          REPO = os.environ.get("REPO", "adaamrd/tiktok-recorder")
          OUT_DIR = os.path.abspath("recordings")
          ICONS = {"da3bolgaming": "🔵", "f_oody7": "🟣", "3absi1999": "🦁"}
          iraq_str = (datetime.utcnow() + timedelta(hours=3)).strftime('%Y-%m-%d %I:%M %p')

          def strict_verify_mp4(raw_path, mp4_path):
              if not os.path.exists(mp4_path):
                  return False
              raw_sz = os.path.getsize(raw_path) if (raw_path and os.path.exists(raw_path)) else 0
              mp4_sz = os.path.getsize(mp4_path)
              if mp4_sz < 500000:
                  return False
              if raw_sz > 0 and mp4_sz < int(raw_sz * 0.85):
                  return False
              try:
                  r = subprocess.run([
                      "ffprobe", "-v", "error", "-show_entries",
                      "stream=codec_type,codec_name,width,height:format=duration",
                      "-of", "json", mp4_path
                  ], capture_output=True, text=True, timeout=30)
                  if r.returncode != 0:
                      return False
                  info = json.loads(r.stdout)
                  streams = info.get("streams") or []
                  vids = [
                      s for s in streams
                      if s.get("codec_type") == "video"
                      and int(s.get("width") or 0) >= 16
                      and int(s.get("height") or 0) >= 16
                  ]
                  auds = [
                      s for s in streams
                      if s.get("codec_type") == "audio"
                      and s.get("codec_name") in ("aac", "mp3")
                  ]
                  dur = float((info.get("format") or {}).get("duration") or 0.0)
                  return len(vids) > 0 and len(auds) > 0 and dur >= 1.0
              except Exception:
                  return False

          if os.path.exists(OUT_DIR):
              for u in os.listdir(OUT_DIR):
                  u_dir = os.path.join(OUT_DIR, u)
                  if not os.path.isdir(u_dir):
                      continue
                  for raw in glob.glob(os.path.join(u_dir, "*_flv.mp4")):
                      base_prefix = raw.replace("_flv.mp4", "")
                      mp4_orig = base_prefix + ".mp4"
                      if not os.path.exists(mp4_orig) and os.path.getsize(raw) > 2000000:
                          subprocess.run([
                              "ffmpeg", "-y", "-fflags", "+genpts+igndts",
                              "-xerror", "-abort_on", "empty_output_stream",
                              "-i", raw, "-map", "0:v:0", "-map", "0:a:0",
                              "-c", "copy", "-movflags", "+faststart", mp4_orig
                          ], check=False)
                          if strict_verify_mp4(raw, mp4_orig):
                              try: os.remove(raw)
                              except Exception: pass
                          else:
                              if os.path.exists(mp4_orig):
                                  try: os.remove(mp4_orig)
                                  except Exception: pass
                              continue
                          clean_base = os.path.basename(base_prefix).replace(f"TK_{u}_", "stream_").replace(u, "stream")
                          clean_prefix = os.path.join(u_dir, clean_base)
                          for ext in [".mp4", ".srt", ".json", ".ass"]:
                              src = base_prefix + ext
                              dst = clean_prefix + ext
                              if os.path.exists(src) and src != dst:
                                  os.replace(src, dst)
                          mp4_path = clean_prefix + ".mp4"
                          srt_path = clean_prefix + ".srt"
                          json_path = clean_prefix + ".json"
                          ass_path = clean_prefix + ".ass"
                          thumb_path = clean_prefix + "_thumbs.jpg"
                          html_path = os.path.join(u_dir, "TikTok_Player.html")
                          generate_sprite_sheet(mp4_path, thumb_path)
                          tag = f"v-{u[:4]}-{int(time.time())}"
                          candidates = []
                          if os.path.exists(json_path):
                              try:
                                  with open(json_path, "r", encoding="utf-8") as jf:
                                      candidates.append(json.load(jf))
                              except Exception:
                                  pass
                          if os.path.exists(srt_path):
                              candidates.append(parse_srt(srt_path))
                          if os.path.exists(ass_path):
                              candidates.append(parse_ass(ass_path))
                          events = max(candidates, key=len) if candidates else []
                          mp4_name = os.path.basename(mp4_path)
                          thumb_name = os.path.basename(thumb_path)
                          video_url = f"https://github.com/{REPO}/releases/download/{tag}/{mp4_name}"
                          thumb_url = f"https://github.com/{REPO}/releases/download/{tag}/{thumb_name}" if os.path.exists(thumb_path) else ""
                          build_html(video_url, events, html_path, thumb_url)
                          write_ass(events, ass_path)
                          icon = ICONS.get(u, "🎥")
                          subprocess.run([
                              "gh", "release", "create", tag, "--latest",
                              "--title", f"{icon} بث {u} ({iraq_str})",
                              "--notes", f"بث الحساب: {u} | توقيت العراق | بوابة فحص صارمة (Video+Audio+85%) + مشغل TikTok_Player.html"
                          ], check=False)
                          for f in [mp4_path, html_path, thumb_path, ass_path, srt_path, json_path]:
                              if os.path.exists(f) and os.path.getsize(f) > 0:
                                  subprocess.run(["gh", "release", "upload", tag, f, "--clobber"], check=False)
          EOF

      - name: Trigger Successor Run (Only on Normal Completion)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run recorder.yml || true
