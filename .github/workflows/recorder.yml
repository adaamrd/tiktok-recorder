                  if not events and asses:
                      subprocess.run(["gh", "release", "download", tag, "-p", asses[0], "-D", "tmp_ui", "--clobber"], check=False)
                      ap = os.path.join("tmp_ui", asses[0])
                      if os.path.exists(ap):
                          events = parse_ass(ap)

                  video_url = f"https://github.com/{REPO}/releases/download/{tag}/{best_mp4}"
                  hp = os.path.join("tmp_ui", "TikTok_Player.html")
                  build_html(video_url, events, hp)
                  subprocess.run(["gh", "release", "upload", tag, hp, "--clobber"], check=False)
          EOF

  record_streamers:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        streamer: [da3bolgaming, f_oody7, 3absi1999]
    concurrency:
      group: rec-${{ matrix.streamer }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Tools & FastStart Patch
        run: |
          command -v ffmpeg >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          git clone https://github.com/Michele0303/tiktok-live-recorder.git
          cd tiktok-live-recorder
          ~/.local/bin/uv venv --python 3.11
          ~/.local/bin/uv sync
          ~/.local/bin/uv pip install TikTokLive yt-dlp

          cat << 'VMEOF' > src/utils/video_management.py
          import os, subprocess
          from utils.logger_manager import logger

          class VideoManagement:
              @staticmethod
              def convert_flv_to_mp4(file):
                  logger.info(f"Converting {file} to FastStart MP4...")
                  out_mp4 = file.replace('_flv.mp4', '.mp4')
                  subprocess.run([
                      "ffmpeg", "-y", "-fflags", "+genpts+igndts", "-i", file,
                      "-c", "copy", "-movflags", "+faststart", out_mp4
                  ], check=False)
                  if os.path.exists(out_mp4) and os.path.getsize(out_mp4) > 0:
                      try:
                          os.remove(file)
                      except Exception:
                          pass
          VMEOF
          cp src/utils/video_management.py src/core/video_management.py || true

      - name: Extract Self-Contained UI Builder
        run: |
          python3 - << 'EOF'
          with open(".github/workflows/recorder.yml", "r", encoding="utf-8") as f:
              text = f.read()
          code = text.split("cat << 'UIFILE' > ui_builder.py\n")[1].split("\n          UIFILE")[0]
          lines = [l[10:] if l.startswith("          ") else l for l in code.splitlines()]
          with open("ui_builder.py", "w", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          EOF

      - name: Run Smart Monitor for ${{ matrix.streamer }} (Auto-Upload 45s After Stream End)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_USER: ${{ matrix.streamer }}
          EXTRA_HOST: ${{ inputs.extra_host || '' }}
          RUN_HOURS: ${{ inputs.hours || '5' }}
        run: |
          cat << 'EOF' > manager.py
          import os, sys, time, glob, json, subprocess, asyncio, threading
          from datetime import datetime
          from ui_builder import parse_srt, parse_ass, write_ass, build_html, clean_emojis

          USER = os.environ.get("TARGET_USER", "da3bolgaming").strip().lstrip("@")
          EXTRA = os.environ.get("EXTRA_HOST", "").strip().lstrip("@")
          if EXTRA and USER == "3absi1999":
              USER = EXTRA
          REPO = os.environ.get("REPO", "adaamrd/tiktok-recorder")
          HOURS = float(os.environ.get("RUN_HOURS", "5"))
          MAX_SECONDS = int(min(HOURS, 4.8) * 3600)
          OUT_DIR = os.path.abspath(f"rec_{USER}")
          os.makedirs(OUT_DIR, exist_ok=True)

          ICONS = {"da3bolgaming": "🔵", "f_oody7": "🟣", "3absi1999": "🦁"}
          ICON = ICONS.get(USER, "🎥")

          def upload_stream_Prefix(base_prefix):
              raw_flv = base_prefix + "_flv.mp4"
              mp4_orig = base_prefix + ".mp4"
              if os.path.exists(raw_flv) and not os.path.exists(mp4_orig) and os.path.getsize(raw_flv) > 2000000:
                  subprocess.run([
                      "ffmpeg", "-y", "-fflags", "+genpts+igndts", "-i", raw_flv,
                      "-c", "copy", "-movflags", "+faststart", mp4_orig
                  ], check=False)
                  if os.path.exists(mp4_orig) and os.path.getsize(mp4_orig) > 0:
                      try: os.remove(raw_flv)
                      except Exception: pass

              if not os.path.exists(mp4_orig) or os.path.getsize(mp4_orig) < 2000000:
                  return False

              clean_base = os.path.basename(base_prefix).replace(f"TK_{USER}_", "stream_").replace(USER, "stream")
              clean_prefix = os.path.join(OUT_DIR, clean_base)
              for ext in [".mp4", ".srt", ".json", ".ass"]:
                  src = base_prefix + ext
                  dst = clean_prefix + ext
                  if os.path.exists(src) and src != dst:
                      os.replace(src, dst)

              mp4_path = clean_prefix + ".mp4"
              srt_path = clean_prefix + ".srt"
              json_path = clean_prefix + ".json"
              ass_path = clean_prefix + ".ass"
              html_path = os.path.join(OUT_DIR, "TikTok_Player.html")

              tag = f"{USER[:5]}-{int(time.time())}"
              events = []
              if os.path.exists(json_path):
                  try:
                      with open(json_path, "r", encoding="utf-8") as jf:
                          events = json.load(jf)
                  except Exception:
                      pass
              if not events and os.path.exists(srt_path):
                  events = parse_srt(srt_path)

              mp4_name = os.path.basename(mp4_path)
              video_url = f"https://github.com/{REPO}/releases/download/{tag}/{mp4_name}"
              build_html(video_url, events, html_path)
              write_ass(events, ass_path)

              subprocess.run([
                  "gh", "release", "create", tag,
                  "--title", f"{ICON} بث {USER} ({datetime.now().strftime('%Y-%m-%d %H:%M')})",
                  "--notes", f"بث الحساب: {USER} | جاهز للتشغيل السريع + مشغل TikTok_Player.html المطور"
              ], check=False)

              for f in [mp4_path, html_path, ass_path, srt_path, json_path]:
                  if os.path.exists(f) and os.path.getsize(f) > 0:
                      subprocess.run(["gh", "release", "upload", tag, f, "--clobber"], check=False)
              return True

          current_srt_path = None
          current_json_path = None
          stream_start_time = None
          srt_counter = 0
          live_events = []
          last_stats_save = 0
          last_likes_save = 0
          srt_lock = threading.Lock()

          def fmt_srt_time(seconds):
              seconds = max(0, int(seconds))
              return f"{seconds//3600:02d}:{(seconds%3600)//60:02d}:{seconds%60:02d},000"

          def start_chat_thread():
              from TikTokLive import TikTokLiveClient
              from TikTokLive.events import CommentEvent, GiftEvent, LikeEvent, RoomUserSeqEvent

              def run_loop():
                  while True:
                      try:
                          loop = asyncio.new_event_loop()
                          asyncio.set_event_loop(loop)
                          client = TikTokLiveClient(unique_id=f"@{USER}")

                          @client.on(CommentEvent)
                          async def on_comment(event: CommentEvent):
                              global srt_counter
                              with srt_lock:
                                  if current_srt_path and stream_start_time:
                                      elapsed = int(time.time() - stream_start_time)
                                      srt_counter += 1
                                      nick = getattr(event.user, "nickname", "User")
                                      text = clean_emojis(getattr(event, "comment", ""))
                                      with open(current_srt_path, "a", encoding="utf-8") as f:
                                          f.write(f"{srt_counter}\n{fmt_srt_time(elapsed)} --> {fmt_srt_time(elapsed+4)}\n[{nick}]: {text}\n\n")
                                      live_events.append({"t": elapsed, "type": "chat", "u": nick, "c": text})
                                      if current_json_path and srt_counter % 5 == 0:
                                          with open(current_json_path, "w", encoding="utf-8") as jf:
                                              json.dump(live_events, jf, ensure_ascii=False)

                          @client.on(GiftEvent)
                          async def on_gift(event: GiftEvent):
                              with srt_lock:
                                  if stream_start_time:
                                      elapsed = int(time.time() - stream_start_time)
                                      nick = getattr(event.user, "nickname", "User")
                                      gname = getattr(event.gift, "name", "Gift")
                                      cnt = getattr(event, "repeat_count", 1)
                                      live_events.append({"t": elapsed, "type": "gift", "u": nick, "c": f"🎁 أرسل {gname} x{cnt}"})

                          @client.on(RoomUserSeqEvent)
                          async def on_viewers(event: RoomUserSeqEvent):
                              global last_stats_save
                              with srt_lock:
                                  if stream_start_time and (time.time() - last_stats_save > 12):
                                      last_stats_save = time.time()
                                      elapsed = int(time.time() - stream_start_time)
                                      v = getattr(event, "m_total", 0)
                                      sups = []
                                      try:
                                          for r in getattr(event, "ranks", [])[:4]:
                                              sn = getattr(r.user, "nickname", "")
                                              if sn: sups.append(sn)
                                      except Exception:
                                          pass
                                      if v or sups:
                                          live_events.append({"t": elapsed, "type": "stats", "v": str(v) if v else "", "sup": sups})

                          @client.on(LikeEvent)
                          async def on_likes(event: LikeEvent):
                              global last_likes_save
                              with srt_lock:
                                  if stream_start_time and (time.time() - last_likes_save > 15):
                                      last_likes_save = time.time()
                                      elapsed = int(time.time() - stream_start_time)
                                      tot = getattr(event, "total_likes", 0)
                                      if tot:
                                          live_events.append({"t": elapsed, "type": "stats", "l": str(tot)})

                          client.run()
                      except Exception:
                          time.sleep(15)

              t = threading.Thread(target=run_loop, daemon=True)
              t.start()

          start_chat_thread()

          cmd = [
              os.path.expanduser("~/.local/bin/uv"), "run", "python", "src/main.py",
              "-user", USER,
              "-mode", "automatic",
              "-automatic_interval", "1",
              "-output", OUT_DIR
          ]
          proc = subprocess.Popen(cmd, cwd="tiktok-live-recorder")

          start_global = time.time()
          uploaded_prefixes = set()
          active_flv = None
          last_flv_size = 0
          last_growth_time = time.time()

          while time.time() - start_global < MAX_SECONDS:
              if proc.poll() is not None:
                  proc = subprocess.Popen(cmd, cwd="tiktok-live-recorder")

              flvs = glob.glob(os.path.join(OUT_DIR, "*_flv.mp4"))
              if flvs:
                  latest_flv = max(flvs, key=os.path.getsize)
                  cur_size = os.path.getsize(latest_flv)
                  if latest_flv != active_flv:
                      with srt_lock:
                          active_flv = latest_flv
                          last_flv_size = cur_size
                          last_growth_time = time.time()
                          base_name = latest_flv.replace("_flv.mp4", "")
                          current_srt_path = base_name + ".srt"
                          current_json_path = base_name + ".json"
                          stream_start_time = time.time()
                          srt_counter = 0
                          live_events = []
                          with open(current_srt_path, "w", encoding="utf-8") as f:
                              f.write("")
                  else:
                      if cur_size > last_flv_size:
                          last_flv_size = cur_size
                          last_growth_time = time.time()
                      elif cur_size > 2000000 and (time.time() - last_growth_time > 45):
                          proc.terminate()
                          time.sleep(2)
                          base_prefix = active_flv.replace("_flv.mp4", "")
                          if base_prefix not in uploaded_prefixes:
                              with srt_lock:
                                  if current_json_path and live_events:
                                      with open(current_json_path, "w", encoding="utf-8") as jf:
                                          json.dump(live_events, jf, ensure_ascii=False)
                              if upload_stream_Prefix(base_prefix):
                                  uploaded_prefixes.add(base_prefix)
                          active_flv = None
                          proc = subprocess.Popen(cmd, cwd="tiktok-live-recorder")

              mp4s = [
                  f for f in glob.glob(os.path.join(OUT_DIR, "*.mp4"))
                  if not f.endswith("_flv.mp4") and os.path.getsize(f) > 2000000
              ]
              for mp4 in mp4s:
                  base_prefix = mp4.replace(".mp4", "")
                  if base_prefix not in uploaded_prefixes:
                      time.sleep(3)
                      if upload_stream_Prefix(base_prefix):
                          uploaded_prefixes.add(base_prefix)

              time.sleep(5)
          EOF
          PYTHONPATH=. ./tiktok-live-recorder/.venv/bin/python manager.py

      - name: Finalize Stream on Session End
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_USER: ${{ matrix.streamer }}
        run: |
          python3 - << 'EOF'
          import os, glob, time, json, subprocess
          from datetime import datetime
          from ui_builder import parse_srt, write_ass, build_html

          USER = os.environ.get("TARGET_USER", "da3bolgaming").strip().lstrip("@")
          REPO = os.environ.get("REPO", "adaamrd/tiktok-recorder")
          OUT_DIR = os.path.abspath(f"rec_{USER}")
          ICONS = {"da3bolgaming": "🔵", "f_oody7": "🟣", "3absi1999": "🦁"}
          ICON = ICONS.get(USER, "🎥")

          if os.path.exists(OUT_DIR):
              for raw in glob.glob(os.path.join(OUT_DIR, "*_flv.mp4")):
                  base_prefix = raw.replace("_flv.mp4", "")
                  mp4_orig = base_prefix + ".mp4"
                  if not os.path.exists(mp4_orig) and os.path.getsize(raw) > 2000000:
                      subprocess.run([
                          "ffmpeg", "-y", "-fflags", "+genpts+igndts", "-i", raw,
                          "-c", "copy", "-movflags", "+faststart", mp4_orig
                      ], check=False)
                      if os.path.exists(mp4_orig) and os.path.getsize(mp4_orig) > 0:
                          try: os.remove(raw)
                          except Exception: pass
                      clean_base = os.path.basename(base_prefix).replace(f"TK_{USER}_", "stream_").replace(USER, "stream")
                      clean_prefix = os.path.join(OUT_DIR, clean_base)
                      for ext in [".mp4", ".srt", ".json", ".ass"]:
                          src = base_prefix + ext
                          dst = clean_prefix + ext
                          if os.path.exists(src) and src != dst:
                              os.replace(src, dst)
                      mp4_path = clean_prefix + ".mp4"
                      srt_path = clean_prefix + ".srt"
                      json_path = clean_prefix + ".json"
                      ass_path = clean_prefix + ".ass"
                      html_path = os.path.join(OUT_DIR, "TikTok_Player.html")
                      tag = f"{USER[:5]}-{int(time.time())}"
                      events = []
                      if os.path.exists(json_path):
                          try:
                              with open(json_path, "r", encoding="utf-8") as jf:
                                  events = json.load(jf)
                          except Exception:
                              pass
                      if not events and os.path.exists(srt_path):
                          events = parse_srt(srt_path)
                      mp4_name = os.path.basename(mp4_path)
                      video_url = f"https://github.com/{REPO}/releases/download/{tag}/{mp4_name}"
                      build_html(video_url, events, html_path)
                      write_ass(events, ass_path)
                      subprocess.run([
                          "gh", "release", "create", tag,
                          "--title", f"{ICON} بث {USER} ({datetime.now().strftime('%Y-%m-%d %H:%M')})",
                          "--notes", f"بث الحساب: {USER} | جاهز للتشغيل السريع + مشغل TikTok_Player.html المطور"
                      ], check=False)
                      for f in [mp4_path, html_path, ass_path, srt_path, json_path]:
                          if os.path.exists(f) and os.path.getsize(f) > 0:
                              subprocess.run(["gh", "release", "upload", tag, f, "--clobber"], check=False)
          EOF
          if [ "${{ matrix.streamer }}" = "da3bolgaming" ]; then
            gh workflow run recorder.yml || true
          fi
