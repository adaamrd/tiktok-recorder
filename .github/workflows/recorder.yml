          }

          function toggleSupBar() {
            hideSupporters = !hideSupporters;
            supBar.style.display = hideSupporters ? 'none' : 'flex';
          }

          function applySettings() {
            var vy = document.getElementById('s-vid-y').value;
            var vx = document.getElementById('s-vid-x').value;
            var vs = document.getElementById('s-vid-scale').value;
            var vsx = document.getElementById('s-vid-sx').value;
            var vsy = document.getElementById('s-vid-sy').value;
            var bb = document.getElementById('s-bar-bottom').value;
            var ct = document.getElementById('s-chat-top').value;
            var cw = document.getElementById('s-chat-width').value;
            var cf = document.getElementById('s-chat-font').value;
            var cb = document.getElementById('s-chat-bg').value;
            document.documentElement.style.setProperty('--vid-y', vy + '%');
            document.documentElement.style.setProperty('--vid-x', vx + '%');
            document.documentElement.style.setProperty('--vid-scale', (vs / 100));
            document.documentElement.style.setProperty('--vid-sx', (vsx / 100));
            document.documentElement.style.setProperty('--vid-sy', (vsy / 100));
            document.documentElement.style.setProperty('--bar-bottom', bb + 'px');
            document.documentElement.style.setProperty('--chat-bottom', (parseInt(bb) + 38) + 'px');
            document.documentElement.style.setProperty('--chat-top', ct + '%');
            document.documentElement.style.setProperty('--chat-width', cw + '%');
            document.documentElement.style.setProperty('--chat-font', cf + 'px');
            document.documentElement.style.setProperty('--chat-bg', (cb / 100));
            resetZoomBtn.style.display = (parseInt(vs) > 103 || parseInt(vy) !== 50 || parseInt(vx) !== 50) ? 'block' : 'none';
            try {
              localStorage.setItem('tt_cfg_v3', JSON.stringify({
                vy:vy, vx:vx, vs:vs, vsx:vsx, vsy:vsy, bb:bb, ct:ct, cw:cw, cf:cf, cb:cb, fit:currentFit
              }));
