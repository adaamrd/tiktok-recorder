                  if r.returncode != 0:
                      return False
                  for a in json.loads(r.stdout).get("assets") or []:
                      if a.get("name") == asset_name and int(a.get("size") or 0) >= int(expected_local_size * 0.98):
                          return True
                  return False
              except Exception:
                  return False

