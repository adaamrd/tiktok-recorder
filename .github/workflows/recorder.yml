              <div class="btn-row">
                <button class="mini-btn active" id="fit-auto" onclick="setFit('auto')">🤖 تلقائي ذكي</button>
                <button class="mini-btn" id="fit-cover" onclick="setFit('cover')">📱 ملء الشاشة</button>
                <button class="mini-btn" id="fit-contain" onclick="setFit('contain')">🖼️ احتواء (للقسط)</button>
                <button class="mini-btn" id="fit-fill" onclick="setFit('fill')">↔️ تمديد</button>
              </div>
              <div class="set-row">
                <span>تكبير مفتوح (Zoom):</span>
                <input type="range" id="s-vid-scale" min="50" max="1000" value="100">
              </div>
              <div class="set-row">
                <span>تمديد العرض (أفقي):</span>
                <input type="range" id="s-vid-sx" min="70" max="200" value="100">
              </div>
              <div class="set-row">
                <span>تمديد الطول (عمودي):</span>
                <input type="range" id="s-vid-sy" min="70" max="200" value="100">
              </div>
              <div class="set-row">
                <span>موقع الفيديو (أعلى/أسفل):</span>
                <input type="range" id="s-vid-y" min="-150" max="250" value="50">
              </div>
              <div class="set-row">
                <span>موقع الفيديو (يمين/يسار):</span>
                <input type="range" id="s-vid-x" min="-150" max="250" value="50">
              </div>
              <div class="set-row">
                <span>ارتفاع شريط التقديم (عن زر Home):</span>
                <input type="range" id="s-bar-bottom" min="12" max="80" value="26">
              </div>

              <div class="set-title">💬 تخصيص التعليقات والمزامنة</div>
              <div class="set-row">
                <span>بداية صندوق التعليقات:</span>
                <input type="range" id="s-chat-top" min="30" max="88" value="62">
              </div>
              <div class="set-row">
                <span>عرض صندوق التعليقات:</span>
                <input type="range" id="s-chat-width" min="50" max="100" value="96">
              </div>
              <div class="set-row">
                <span>حجم خط التعليقات:</span>
                <input type="range" id="s-chat-font" min="10" max="24" value="13">
              </div>
              <div class="set-row">
                <span>شفافية خلفية التعليق:</span>
                <input type="range" id="s-chat-bg" min="0" max="95" value="45">
              </div>
              <div class="btn-row">
                <button class="mini-btn" onclick="shiftChat(-2)">⏪ تعليقات -2ث</button>
                <button class="mini-btn" onclick="shiftChat(0)" id="chat-off-lbl">تزامن: 0ث</button>
                <button class="mini-btn" onclick="shiftChat(2)">⏩ تعليقات +2ث</button>
              </div>

              <div class="set-title">⚡ السرعة والعناصر</div>
              <div class="btn-row">
                <button class="mini-btn" onclick="setSpeed(0.75)">0.75x</button>
                <button class="mini-btn active" id="sp-1" onclick="setSpeed(1)">1x</button>
                <button class="mini-btn" onclick="setSpeed(1.25)">1.25x</button>
                <button class="mini-btn" onclick="setSpeed(1.5)">1.5x</button>
                <button class="mini-btn" onclick="setSpeed(2)">2x</button>
              </div>
              <div style="display:flex;justify-content:space-between;gap:6px;margin-top:4px;">
                <button class="mini-btn" onclick="toggleSupBar()">👑 إظهار/إخفاء الداعمين</button>
                <button class="mini-btn" onclick="resetSettings()">🔄 افتراضي</button>
                <button class="mini-btn active" onclick="toggleSettings()">✓ إغلاق</button>
              </div>
            </div>

            <div id="ui-layer">
              <div id="chat-box"></div>
            </div>

            <div id="seek-preview">
              <div id="prev-sprite"></div>
              <video id="prev-vid" muted playsinline preload="metadata"></video>
              <span id="prev-time">00:00:00</span>
              <span id="prev-chat"></span>
            </div>

            <div id="bottom-stack">
              <div id="time-row">
                <span id="time-display">00:00:00 / --:--:--</span>
              </div>
              <div id="controls-bar">
                <button id="play-pause-btn" onclick="togglePlay()">⏸️</button>
                <div id="seek-wrap">
                  <div id="markers-layer"></div>
                  <input type="range" id="seek" min="0" max="18000" value="0" step="1">
                </div>
              </div>
            </div>
          </div>
          <script>
          const EVENTS = __EVENTS_JSON__;
          const THUMB_URL = "__THUMB_URL__";
          const appEl = document.getElementById('app');
          const vid = document.getElementById('vid');
          const prevVid = document.getElementById('prev-vid');
          const prevSprite = document.getElementById('prev-sprite');
          const seekPreview = document.getElementById('seek-preview');
          const prevTime = document.getElementById('prev-time');
          const prevChat = document.getElementById('prev-chat');
          const touchZone = document.getElementById('touch-zone');
          const bigPlay = document.getElementById('big-play');
          const hudPlayBtn = document.getElementById('hud-play-btn');
          const barPlayBtn = document.getElementById('play-pause-btn');
          const resetZoomBtn = document.getElementById('reset-zoom-btn');
          const badge = document.getElementById('gesture-badge');
          const topStack = document.getElementById('top-ui-stack');
          const bottomStack = document.getElementById('bottom-stack');
          const settingsPanel = document.getElementById('settings-panel');
          const chatBox = document.getElementById('chat-box');
          const uiLayer = document.getElementById('ui-layer');
          const seek = document.getElementById('seek');
          const markersLayer = document.getElementById('markers-layer');
          const timeDisplay = document.getElementById('time-display');
          const viewerPill = document.getElementById('viewer-count');
          const likesPill = document.getElementById('likes-count');
          const supBar = document.getElementById('supporters-bar');
          const pkBar = document.getElementById('pk-bar');
          const pkLeftFill = document.getElementById('pk-left-fill');
          const pkLTxt = document.getElementById('pk-l-txt');
          const pkRTxt = document.getElementById('pk-r-txt');
          const COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#a855f7','#ec4899'];
          var currentFit = 'auto';
          var hideSupporters = false;
          var chatOffset = 0;
          var wantPlay = false, retryTimer = null;
          var totalDuration = EVENTS.length > 0 ? Math.max(60, EVENTS[EVENTS.length - 1].t + 15) : 3600;
          seek.max = totalDuration;

          if (THUMB_URL) {
            prevSprite.style.backgroundImage = 'url(' + THUMB_URL + ')';
            prevSprite.style.display = 'block';
          }

          function renderMarkers() {
            markersLayer.innerHTML = '';
            if (!totalDuration || totalDuration <= 0) return;
            EVENTS.forEach(function(ev) {
              if ((ev.type === 'gift' && (ev.d >= 500 || (ev.c && ev.c.indexOf('x') !== -1))) || ev.type === 'pk') {
                var m = document.createElement('div');
                m.className = 't-marker';
                m.style.left = Math.min(99, Math.max(1, (ev.t / totalDuration) * 100)) + '%';
                m.style.background = ev.type === 'gift' ? '#fde047' : '#ff0050';
                markersLayer.appendChild(m);
              }
            });
          }
          renderMarkers();

          function autoAdjustAspect() {
            if (currentFit !== 'auto') return;
            var vw = vid.videoWidth, vh = vid.videoHeight;
            if (!vw || !vh) return;
            var ratio = vh / vw;
            var fit = ratio >= 1.52 ? 'cover' : 'contain';
            document.documentElement.style.setProperty('--vid-fit', fit);
          }
          vid.addEventListener('resize', autoAdjustAspect);
          vid.addEventListener('loadedmetadata', function() {
            if (vid.duration && isFinite(vid.duration)) {
              totalDuration = vid.duration;
              seek.max = totalDuration;
              renderMarkers();
            }
            autoAdjustAspect();
            if (wantPlay && vid.paused) vid.play().catch(function(){});
          });
          vid.addEventListener('canplay', function() {
            if (wantPlay && vid.paused) vid.play().catch(function(){});
          });

          function shiftChat(delta) {
            if (delta === 0) chatOffset = 0;
            else chatOffset += delta;
            document.getElementById('chat-off-lbl').textContent = 'تزامن: ' + (chatOffset > 0 ? '+' : '') + chatOffset + 'ث';
            syncChatTo(vid.currentTime + chatOffset);
          }

          function fmtHMS(sec) {
            sec = Math.max(0, Math.floor(sec || 0));
            var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
            return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
          }

          var idleTimer = null;
          function wakeHUD() {
            topStack.classList.remove('idle');
            bottomStack.classList.remove('idle');
            if (idleTimer) clearTimeout(idleTimer);
            if (!vid.paused && vid.currentTime > 0 && settingsPanel.style.display !== 'flex') {
              idleTimer = setTimeout(function() {
                topStack.classList.add('idle');
                bottomStack.classList.add('idle');
              }, 3500);
            }
          }

          function handleBigPlay() {
            wantPlay = true;
            bigPlay.textContent = '⏳ جاري الاتصال بالسيرفر...';
            if (vid.readyState === 0) vid.load();
            var p = vid.play();
            if (p && p.catch) {
              p.catch(function() {
                if (retryTimer) clearInterval(retryTimer);
                retryTimer = setInterval(function() {
                  if (!wantPlay || !vid.paused) { clearInterval(retryTimer); return; }
                  vid.play().catch(function(){});
                }, 900);
              });
            }
          }

          vid.addEventListener('waiting', function() { showBadge('⏳ جاري التحميل...', 2500); });
          vid.addEventListener('playing', function() {
            wantPlay = false;
            if (retryTimer) { clearInterval(retryTimer); retryTimer = null; }
            bigPlay.style.display = 'none';
            badge.style.display = 'none';
            hudPlayBtn.textContent = '⏸️';
            barPlayBtn.textContent = '⏸️';
            wakeHUD();
          });

          document.addEventListener('fullscreenchange', function() {
            document.body.classList.toggle('is-fs', !!document.fullscreenElement);
          });

          function setFit(mode) {
            currentFit = mode;
            if (mode === 'auto') autoAdjustAspect();
            else document.documentElement.style.setProperty('--vid-fit', mode);
            ['auto','cover','contain','fill'].forEach(function(m) {
              var b = document.getElementById('fit-' + m);
              if (b) b.classList.toggle('active', m === mode);
            });
            applySettings();
          }

          function setSpeed(r) {
            vid.playbackRate = r;
            showBadge('⚡ السرعة ' + r + 'x', 800);
          }

          function toggleSupBar() {
            hideSupporters = !hideSupporters;
            supBar.style.display = hideSupporters ? 'none' : 'flex';
          }

          function applySettings() {
            var vy = parseFloat(document.getElementById('s-vid-y').value);
            var vx = parseFloat(document.getElementById('s-vid-x').value);
            var vs = parseFloat(document.getElementById('s-vid-scale').value);
            var vsx = parseFloat(document.getElementById('s-vid-sx').value);
            var vsy = parseFloat(document.getElementById('s-vid-sy').value);
            var bb = parseFloat(document.getElementById('s-bar-bottom').value);
            var ct = parseFloat(document.getElementById('s-chat-top').value);
            var cw = parseFloat(document.getElementById('s-chat-width').value);
            var cf = parseFloat(document.getElementById('s-chat-font').value);
            var cb = parseFloat(document.getElementById('s-chat-bg').value);
            document.documentElement.style.setProperty('--vid-y', vy + '%');
            document.documentElement.style.setProperty('--vid-x', vx + '%');
            document.documentElement.style.setProperty('--vid-scale', (vs / 100));
            document.documentElement.style.setProperty('--vid-sx', (vsx / 100));
            document.documentElement.style.setProperty('--vid-sy', (vsy / 100));
            document.documentElement.style.setProperty('--bar-bottom', bb + 'px');
            document.documentElement.style.setProperty('--chat-bottom', (bb + 60) + 'px');
            document.documentElement.style.setProperty('--chat-top', ct + '%');
            document.documentElement.style.setProperty('--chat-width', cw + '%');
            document.documentElement.style.setProperty('--chat-font', cf + 'px');
            document.documentElement.style.setProperty('--chat-bg', (cb / 100));
            resetZoomBtn.style.display = (vs > 103 || Math.abs(vy - 50) > 1 || Math.abs(vx - 50) > 1) ? 'block' : 'none';
          }

          function resetPinchZoom() {
            document.getElementById('s-vid-scale').value = 100;
            document.getElementById('s-vid-sx').value = 100;
            document.getElementById('s-vid-sy').value = 100;
            document.getElementById('s-vid-y').value = 50;
            document.getElementById('s-vid-x').value = 50;
            applySettings();
            resetZoomBtn.style.display = 'none';
            showBadge('🔄 تم إرجاع الحجم الحقيقي 1x', 800);
          }

          function resetSettings() {
            document.getElementById('s-bar-bottom').value = 26;
            document.getElementById('s-chat-top').value = 62;
            document.getElementById('s-chat-width').value = 96;
            document.getElementById('s-chat-font').value = 13;
            document.getElementById('s-chat-bg').value = 45;
            setFit('auto');
            resetPinchZoom();
          }

          ['s-vid-y','s-vid-x','s-vid-scale','s-vid-sx','s-vid-sy','s-bar-bottom','s-chat-top','s-chat-width','s-chat-font','s-chat-bg'].forEach(function(id) {
            document.getElementById(id).addEventListener('input', applySettings);
          });

          function toggleSettings() {
            settingsPanel.style.display = settingsPanel.style.display === 'flex' ? 'none' : 'flex';
            wakeHUD();
          }

          function toggleCC() {
            document.body.classList.toggle('cc-mode');
            document.getElementById('cc-btn').classList.toggle('active');
            wakeHUD();
          }

          function toggleFull() {
            if (!document.fullscreenElement) {
              if (appEl.requestFullscreen) appEl.requestFullscreen();
              else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            } else {
              if (document.exitFullscreen) document.exitFullscreen();
            }
            wakeHUD();
          }

          var userScrollingChat = false, chatScrollTimer = null;
          chatBox.addEventListener('touchstart', function(e) {
            e.stopPropagation();
            userScrollingChat = true;
            if (chatScrollTimer) clearTimeout(chatScrollTimer);
          }, {passive: true});
          chatBox.addEventListener('touchend', function(e) {
            e.stopPropagation();
            chatScrollTimer = setTimeout(function() { userScrollingChat = false; }, 5000);
          }, {passive: true});

          function showBadge(txt, ms) {
            badge.textContent = txt;
            badge.style.display = 'block';
            if (ms) setTimeout(function() { badge.style.display = 'none'; }, ms);
          }

          document.getElementById('local-file').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
              var blobUrl = URL.createObjectURL(e.target.files[0]);
              vid.src = blobUrl;
              prevVid.src = blobUrl;
              prevSprite.style.display = 'none';
              prevVid.style.display = 'block';
              vid.play();
            }
          });

          function togglePlay() {
            if (vid.paused) {
              handleBigPlay();
            } else {
              wantPlay = false;
              vid.pause();
            }
            wakeHUD();
          }
          vid.addEventListener('pause', function() {
            hudPlayBtn.textContent = '▶️';
            barPlayBtn.textContent = '▶️';
            bigPlay.textContent = '▶️ تشغيل البث';
            bigPlay.style.display = 'block';
            wakeHUD();
          });

          function toggleUI() {
            uiLayer.classList.toggle('hidden');
            supBar.style.opacity = uiLayer.classList.contains('hidden') ? '0' : '1';
            wakeHUD();
          }

          function syncChatTo(targetTime) {
            chatBox.innerHTML = '';
            lastIdx = 0;
            while (lastIdx < EVENTS.length && EVENTS[lastIdx].t < targetTime - 15) lastIdx++;
            while (lastIdx < EVENTS.length && EVENTS[lastIdx].t <= targetTime) {
              addChatRow(EVENTS[lastIdx]);
              lastIdx++;
            }
          }

          var tStartX = 0, tStartY = 0, longPressTimer = null, isLongPress = false, lastTapTime = 0;
          var isPinching = false, startPinchDist = 0, startPinchScale = 100;
          var isPanningZoom = false, panStartVX = 50, panStartVY = 50;

          function getDist(t1, t2) {
            return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
          }

          touchZone.addEventListener('touchstart', function(e) {
            wakeHUD();
            if (e.touches.length === 2) {
              isPinching = true;
              isPanningZoom = false;
              if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
              startPinchDist = getDist(e.touches[0], e.touches[1]);
              startPinchScale = parseFloat(document.getElementById('s-vid-scale').value) || 100;
              return;
            }
            tStartX = e.changedTouches[0].clientX;
            tStartY = e.changedTouches[0].clientY;
            var curScale = parseFloat(document.getElementById('s-vid-scale').value) || 100;
            if (curScale > 103) {
              isPanningZoom = true;
              panStartVX = parseFloat(document.getElementById('s-vid-x').value) || 50;
              panStartVY = parseFloat(document.getElementById('s-vid-y').value) || 50;
            } else {
              isPanningZoom = false;
            }
            isLongPress = false;
            longPressTimer = setTimeout(function() {
              if (!isPinching && !isPanningZoom) {
                isLongPress = true;
                vid.playbackRate = 2.0;
                showBadge('⚡ السرعة 2x', 0);
              }
            }, 380);
          }, {passive: true});

          touchZone.addEventListener('touchmove', function(e) {
            if (isPinching && e.touches.length === 2) {
              var curDist = getDist(e.touches[0], e.touches[1]);
              if (startPinchDist > 10) {
                var newScale = Math.round(startPinchScale * (curDist / startPinchDist));
                if (newScale <= 102) {
                  newScale = 100;
                  document.getElementById('s-vid-x').value = 50;
                  document.getElementById('s-vid-y').value = 50;
                }
                newScale = Math.max(100, Math.min(1000, newScale));
                document.getElementById('s-vid-scale').value = newScale;
                applySettings();
                showBadge('🔍 زوم: ' + (newScale / 100).toFixed(1) + 'x', 600);
              }
              return;
            }
            var curX = e.changedTouches[0].clientX;
            var curY = e.changedTouches[0].clientY;
            var dx = curX - tStartX;
            var dy = curY - tStartY;
            if (Math.abs(dx) > 12 || Math.abs(dy) > 12) {
              if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
            }
            if (isPanningZoom && e.touches.length === 1) {
              var w = window.innerWidth || 360, h = window.innerHeight || 640;
              var nx = Math.max(-150, Math.min(250, panStartVX + (dx / w) * 100));
              var ny = Math.max(-150, Math.min(250, panStartVY + (dy / h) * 100));
              document.getElementById('s-vid-x').value = nx;
              document.getElementById('s-vid-y').value = ny;
              applySettings();
            }
          }, {passive: true});

          touchZone.addEventListener('touchend', function(e) {
            if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
            if (isPinching) {
              if (e.touches.length < 2) {
                isPinching = false;
                var finalScale = parseFloat(document.getElementById('s-vid-scale').value) || 100;
                if (finalScale <= 103) resetPinchZoom();
              }
              return;
            }
            if (isLongPress) {
              vid.playbackRate = 1.0;
              badge.style.display = 'none';
              isLongPress = false;
              return;
            }
            var endX = e.changedTouches[0].clientX;
            var endY = e.changedTouches[0].clientY;
            var dx = endX - tStartX;
            var dy = Math.abs(endY - tStartY);
            if (!isPanningZoom && Math.abs(dx) > 60 && dy < 90) {
              if (dx > 0) { uiLayer.classList.add('hidden'); supBar.style.opacity = '0'; }
              else { uiLayer.classList.remove('hidden'); supBar.style.opacity = '1'; }
              return;
            }
            isPanningZoom = false;
            var now = Date.now();
            if (Math.abs(dx) < 15 && dy < 15) {
              if (now - lastTapTime < 280) {
                var w = window.innerWidth;
                if (endX > w / 2) {
                  vid.currentTime = Math.min(vid.duration || 99999, vid.currentTime + 5);
                  showBadge('⏩ +5 ثوانٍ', 750);
                } else {
                  vid.currentTime = Math.max(0, vid.currentTime - 5);
                  showBadge('⏪ -5 ثوانٍ', 750);
                }
                syncChatTo(vid.currentTime + chatOffset);
                lastTapTime = 0;
              } else {
                lastTapTime = now;
                if (settingsPanel.style.display === 'flex') {
                  settingsPanel.style.display = 'none';
                }
                wakeHUD();
              }
            }
          }, {passive: true});

          function colorFor(name) {
            var h = 0;
            for (var i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
            return COLORS[Math.abs(h) % COLORS.length];
          }

          function addChatRow(ev) {
            if (ev.type === 'stats') {
              if (ev.v) { viewerPill.style.display = 'inline-block'; viewerPill.textContent = '👁️ ' + ev.v; }
              if (ev.l) { likesPill.style.display = 'inline-block'; likesPill.textContent = '❤️ ' + ev.l; }
              if (ev.sup && ev.sup.length && !hideSupporters) {
                supBar.style.display = 'flex';
                supBar.innerHTML = '';
                ev.sup.forEach(function(s) {
                  var sp = document.createElement('span');
                  sp.className = 'sup-pill';
                  sp.textContent = '👑 ' + s;
                  supBar.appendChild(sp);
                });
              }
              return;
            }
            if (ev.type === 'pk') {
              var l = ev.l || 0, r = ev.r || 0;
              if (l === 0 && r === 0) { pkBar.style.display = 'none'; return; }
              pkBar.style.display = 'block';
              var tot = (l + r) || 1;
              pkLeftFill.style.width = Math.min(92, Math.max(8, (l / tot) * 100)) + '%';
              pkLTxt.textContent = l;
              pkRTxt.textContent = r;
              return;
            }
            if (ev.type !== 'chat' && ev.type !== 'gift') return;
            var div = document.createElement('div');
            div.className = ev.type === 'gift' ? 'chat-msg gift-msg' : 'chat-msg';
            var u = ev.u || 'User';
            var av = document.createElement('div');
            av.className = 'chat-avatar';
            av.style.background = colorFor(u);
            av.textContent = u.charAt(0).toUpperCase();
            var content = document.createElement('div');
            content.className = 'chat-content';
            var uSpan = document.createElement('span');
            uSpan.className = 'chat-user';
            uSpan.textContent = u + ':';
            var tSpan = document.createElement('span');
            tSpan.className = 'chat-text';
            tSpan.textContent = ev.c || '';
            content.appendChild(uSpan);
            content.appendChild(tSpan);
            div.appendChild(av);
            div.appendChild(content);
            chatBox.appendChild(div);
            while (chatBox.children.length > 40) chatBox.removeChild(chatBox.firstChild);
            if (!userScrollingChat) chatBox.scrollTop = chatBox.scrollHeight;
          }

          var lastIdx = 0, lastPrevUpdate = 0;
          function findChatAt(sec) {
            var lo = 0, hi = EVENTS.length - 1, best = null;
            while (lo <= hi) {
              var mid = (lo + hi) >> 1;
              if (EVENTS[mid].t <= sec) {
                if (EVENTS[mid].type === 'chat') best = EVENTS[mid];
                lo = mid + 1;
              } else {
                hi = mid - 1;
              }
            }
            return best ? (best.u + ': ' + best.c) : '';
          }

          seek.addEventListener('input', function() {
            wakeHUD();
            var targetTime = parseFloat(seek.value);
            var maxVal = parseFloat(seek.max) || 1;
            var pct = Math.max(0.12, Math.min(0.88, targetTime / maxVal));
            seekPreview.style.display = 'flex';
            seekPreview.style.left = (pct * 100) + '%';
            prevTime.textContent = fmtHMS(targetTime);
            prevChat.textContent = findChatAt(targetTime + chatOffset);
            if (THUMB_URL && prevSprite.style.display === 'block') {
              var idx = Math.min(99, Math.max(0, Math.floor((targetTime / maxVal) * 100)));
              var col = idx % 10, row = Math.floor(idx / 10);
              prevSprite.style.backgroundPosition = (-col * 100) + 'px ' + (-row * 140) + 'px';
            } else if (prevVid.style.display === 'block') {
              var now = Date.now();
              if (now - lastPrevUpdate > 180) {
                lastPrevUpdate = now;
                try { prevVid.currentTime = targetTime; } catch(e){}
              }
            }
            vid.currentTime = targetTime;
            syncChatTo(targetTime + chatOffset);
          });

          seek.addEventListener('change', function() {
            setTimeout(function() { seekPreview.style.display = 'none'; }, 400);
          });
          seek.addEventListener('touchend', function() {
            setTimeout(function() { seekPreview.style.display = 'none'; }, 400);
          });

