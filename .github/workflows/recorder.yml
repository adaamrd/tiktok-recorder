            var adjCur = cur + chatOffset;
            while (lastIdx < EVENTS.length && EVENTS[lastIdx].t <= adjCur) {
              addChatRow(EVENTS[lastIdx]);
              lastIdx++;
            }
          });
          </script>
          </body>
          </html>"""

          def build_html(video_url, events, out_html_path, thumb_url=""):
              compacted = compact_events(events)
              safe_json = json.dumps(compacted, ensure_ascii=False).replace("</", "<\\/")
              out = (
                  PLAYER_HTML
                  .replace("__VIDEO_URL__", video_url)
                  .replace("__THUMB_URL__", thumb_url)
                  .replace("__EVENTS_JSON__", safe_json)
              )
              with open(out_html_path, "w", encoding="utf-8") as f:
