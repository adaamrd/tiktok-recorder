          def parse_cookie_secret(raw):
              raw = (raw or "").strip()
              jar = {}
              if not raw:
                  return jar
              if raw.startswith("[") or raw.startswith("{"):
                  try:
                      data = json.loads(raw)
                      if isinstance(data, list):
                          for item in data:
                              if isinstance(item, dict) and "name" in item and "value" in item:
                                  jar[str(item["name"]).strip()] = str(item["value"]).strip()
                      elif isinstance(data, dict):
                          for k, v in data.items():
                              jar[str(k).strip()] = str(v).strip()
                      return jar
                  except Exception:
                      pass
              if "=" in raw:
                  for part in re.split(r"[;\n]+", raw):
                      if "=" in part and not part.strip().startswith("#"):
                          k, v = part.strip().split("=", 1)
                          jar[k.strip()] = v.strip()
                  if jar:
                      return jar
              for line in raw.splitlines():
                  cols = line.strip().split("\t")
                  if len(cols) >= 7:
                      jar[cols[5].strip()] = cols[6].strip()
              if not jar and len(raw) >= 16 and " " not in raw:
                  jar["sessionid"] = raw
                  jar["sessionid_ss"] = raw
              return jar

