          }
          * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: system-ui, -apple-system, sans-serif; }
          body, html { width: 100%; height: 100%; background: #000; overflow: hidden; color: #fff; touch-action: none; }
          #app { position: fixed; inset: 0; width: 100%; height: 100%; max-width: 540px; margin: 0 auto; background: #000; overflow: hidden; }
