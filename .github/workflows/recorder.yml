name: TikTok Ultimate Recorder

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '12 */5 * * *'
  workflow_dispatch:
    inputs:
      extra_host:
        description: 'يوزر إضافي (اختياري لو صعدوا قست عند شخص جديد)'
        required: false
        default: ''
        type: string
      hours:
        description: 'عدد ساعات المراقبة (من 1 إلى 5)'
        required: false
        default: '5'
        type: string

permissions:
  contents: write
  actions: write

jobs:
  unified_recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: unified-tiktok-recorder
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Tools & Patch Video Engine with Strict ffprobe Gate
        run: |
          command -v ffmpeg >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          git clone https://github.com/Michele0303/tiktok-live-recorder.git
          cd tiktok-live-recorder
          ~/.local/bin/uv venv --python 3.11
          ~/.local/bin/uv sync
          ~/.local/bin/uv pip install TikTokLive yt-dlp httpx curl_cffi

          cat << 'VMEOF' > src/utils/video_management.py
          import os, json, subprocess
          from utils.logger_manager import logger

          def strict_verify_mp4(raw_path, mp4_path):
              if not os.path.exists(mp4_path):
                  return False
              raw_sz = os.path.getsize(raw_path) if (raw_path and os.path.exists(raw_path)) else 0
              mp4_sz = os.path.getsize(mp4_path)
              if mp4_sz < 500000:
                  return False
              if raw_sz > 0 and mp4_sz < int(raw_sz * 0.85):
                  return False
              try:
                  r = subprocess.run([
                      "ffprobe", "-v", "error", "-show_entries",
                      "stream=codec_type,codec_name,width,height:format=duration",
                      "-of", "json", mp4_path
                  ], capture_output=True, text=True, timeout=30)
                  if r.returncode != 0:
                      return False
                  info = json.loads(r.stdout)
                  streams = info.get("streams") or []
                  vids = [
                      s for s in streams
                      if s.get("codec_type") == "video"
                      and int(s.get("width") or 0) >= 16
                      and int(s.get("height") or 0) >= 16
                  ]
                  auds = [
                      s for s in streams
                      if s.get("codec_type") == "audio"
                      and s.get("codec_name") in ("aac", "mp3")
                  ]
                  dur = float((info.get("format") or {}).get("duration") or 0.0)
                  return len(vids) > 0 and len(auds) > 0 and dur >= 1.0
              except Exception:
                  return False

          class VideoManagement:
              @staticmethod
              def convert_flv_to_mp4(file, *args, **kwargs):
                  logger.info(f"Converting {file} to FastStart MP4 with strict gate...")
                  out_mp4 = file.replace('_flv.mp4', '.mp4')
                  subprocess.run([
                      "ffmpeg", "-y", "-fflags", "+genpts+igndts",
                      "-xerror", "-abort_on", "empty_output_stream",
                      "-i", file, "-map", "0:v:0", "-map", "0:a:0",
                      "-c", "copy", "-movflags", "+faststart", out_mp4
                  ], check=False)
                  if strict_verify_mp4(file, out_mp4):
                      try:
                          os.remove(file)
                      except Exception:
                          pass
                  else:
                      logger.error("Strict gate blocked remux! Keeping raw FLV on disk.")
                      if os.path.exists(out_mp4):
                          try: os.remove(out_mp4)
                          except Exception: pass
          VMEOF
          cp src/utils/video_management.py src/core/video_management.py || true

      - name: Prepare UI Builder & Upgrade Existing Players Safely
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cat << 'UIFILE' > ui_builder.py
          import os, re, json, subprocess

          EMOJI_MAP = {
              "[laughcry]": "😂", "[cry]": "😭", "[smile]": "😊", "[loveface]": "😍",
              "[angry]": "😡", "[scream]": "😱", "[weep]": "😢", "[tears]": "🥹",
              "[flushed]": "😳", "[cool]": "😎", "[proud]": "😏", "[wink]": "😉",
              "[embarrassed]": "😅", "[shock]": "😲", "[thinking]": "🤔", "[clap]": "👏",
              "[thumbsup]": "👍", "[heart]": "❤️", "[fire]": "🔥", "[rose]": "🌹"
          }

          def clean_emojis(text):
              for k, v in EMOJI_MAP.items():
                  text = text.replace(k, v)
              return re.sub(r"\[[a-zA-Z0-9_]+\]", "😂", text)

          def compact_events(events):
              cleaned = []
              last_stat_t = -999
              cur_v, cur_l, cur_sup = "", "", []
              for ev in events:
                  tp = ev.get("type", "chat")
                  t = int(ev.get("t", 0))
                  if tp == "stats":
                      if ev.get("v"): cur_v = str(ev["v"])
                      if ev.get("l"): cur_l = str(ev["l"])
                      if ev.get("sup"): cur_sup = ev["sup"][:4]
                      if t - last_stat_t >= 10:
                          last_stat_t = t
                          st = {"t": t, "type": "stats"}
                          if cur_v: st["v"] = cur_v
                          if cur_l: st["l"] = cur_l
                          if cur_sup: st["sup"] = cur_sup
                          cleaned.append(st)
                  elif tp == "pk":
                      cleaned.append({"t": t, "type": "pk", "l": int(ev.get("l", 0)), "r": int(ev.get("r", 0))})
                  elif tp in ("chat", "gift"):
                      u = str(ev.get("u", "User"))[:28]
                      c = clean_emojis(str(ev.get("c", "")))[:160]
                      if c:
                          item = {"t": t, "type": tp, "u": u, "c": c}
                          if ev.get("d"): item["d"] = int(ev["d"])
                          cleaned.append(item)
              cleaned.sort(key=lambda x: x["t"])
              if len(cleaned) > 18000:
                  step = max(1, len(cleaned) // 18000)
                  cleaned = [e for i, e in enumerate(cleaned) if e["type"] != "chat" or i % step == 0]
              return cleaned

          def parse_srt(srt_path):
              events = []
              if not os.path.exists(srt_path):
                  return events
              with open(srt_path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              for b in re.split(r"\n\s*\n", content.strip()):
                  lines = [l.strip() for l in b.strip().splitlines() if l.strip()]
                  if len(lines) >= 3 and "-->" in lines[1]:
                      t_part = lines[1].split("-->")[0].strip().split(",")[0]
                      p = t_part.split(":")
                      sec = int(p[0])*3600 + int(p[1])*60 + int(p[2]) if len(p) == 3 else 0
                      msg = " ".join(lines[2:])
                      m = re.match(r"^\[(.*?)\]:\s*(.*)$", msg)
                      u, c = (m.group(1), m.group(2)) if m else ("User", msg)
                      c = clean_emojis(c)
                      if c:
                          events.append({"t": sec, "type": "chat", "u": u, "c": c})
              return events

          def parse_ass(ass_path):
              events = []
              if not os.path.exists(ass_path):
                  return events
              with open(ass_path, "r", encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      if line.startswith("Dialogue:"):
                          parts = line.split(",", 9)
                          if len(parts) >= 10:
                              st = parts[1].strip().split(".")[0]
                              p = st.split(":")
                              sec = int(p[0])*3600 + int(p[1])*60 + int(p[2]) if len(p) == 3 else 0
                              txt = re.sub(r"\{.*?\}", "", parts[9]).strip()
                              if ":" in txt:
                                  u, c = txt.split(":", 1)
                              else:
                                  u, c = "User", txt
                              tp = "gift" if "🎁" in c else "chat"
                              events.append({"t": sec, "type": tp, "u": u.strip(), "c": clean_emojis(c.strip())})
              return events

          def generate_sprite_sheet(mp4_path, out_jpg):
              try:
                  pr = subprocess.run([
                      "ffprobe", "-v", "error", "-show_entries", "format=duration",
                      "-of", "default=noprint_wrappers=1:nokey=1", mp4_path
                  ], capture_output=True, text=True)
                  dur = float(pr.stdout.strip() or "3600")
              except Exception:
                  dur = 3600.0
              step = max(5, int(dur / 100))
              subprocess.run([
                  "ffmpeg", "-y", "-i", mp4_path,
                  "-vf", f"fps=1/{step},scale=100:140:force_original_aspect_ratio=decrease,pad=100:140:(ow-iw)/2:(oh-ih)/2,tile=10x10",
                  "-frames:v", "1", "-q:v", "6", out_jpg
              ], check=False)

          def write_ass(events, ass_path):
              hdr = "[Script Info]\nScriptType: v4.00+\nPlayResX: 1080\nPlayResY: 1920\n\n[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\nStyle: TikTokChat,sans-serif,32,&H00FFFFFF,&H000000FF,&H00000000,&H80000000,1,0,0,0,100,100,0,0,1,2,1,3,35,35,35,0\n\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
              with open(ass_path, "w", encoding="utf-8-sig") as f:
                  f.write(hdr)
                  for ev in events:
                      if ev.get("type") in ("chat", "gift"):
                          s = max(0, int(ev["t"]))
                          e = s + 2
                          st = f"{s//3600}:{(s%3600)//60:02d}:{s%60:02d}.00"
                          et = f"{e//3600}:{(e%3600)//60:02d}:{e%60:02d}.00"
                          u = ev.get("u", "User").replace(",", " ")
                          c = clean_emojis(ev.get("c", "")).replace("\n", " ")
                          f.write("Dialogue: 0," + st + "," + et + ",TikTokChat,,0,0,0,,{\\c&H0080FFFF&}" + u + ": {\\c&H00FFFFFF&}" + c + "\n")

