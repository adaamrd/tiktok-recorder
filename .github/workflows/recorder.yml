              document.getElementById('s-vid-y').value = saved.vy || 50;
              document.getElementById('s-vid-x').value = saved.vx || 50;
              document.getElementById('s-vid-scale').value = saved.vs || 100;
              document.getElementById('s-vid-sx').value = saved.vsx || 100;
              document.getElementById('s-vid-sy').value = saved.vsy || 100;
              document.getElementById('s-bar-bottom').value = saved.bb || 26;
              document.getElementById('s-chat-top').value = saved.ct || 62;
              document.getElementById('s-chat-width').value = saved.cw || 96;
              document.getElementById('s-chat-font').value = saved.cf || 13;
              document.getElementById('s-chat-bg').value = saved.cb !== undefined ? saved.cb : 45;
              setFit(saved.fit || 'cover');
            }
          } catch(e){}

          ['s-vid-y','s-vid-x','s-vid-scale','s-vid-sx','s-vid-sy','s-bar-bottom','s-chat-top','s-chat-width','s-chat-font','s-chat-bg'].forEach(function(id) {
            document.getElementById(id).addEventListener('input', applySettings);
          });

          function toggleSettings() {
            settingsPanel.style.display = settingsPanel.style.display === 'flex' ? 'none' : 'flex';
            wakeHUD();
          }

          function toggleCC() {
            document.body.classList.toggle('cc-mode');
            document.getElementById('cc-btn').classList.toggle('active');
            wakeHUD();
          }

          function toggleFull() {
            if (!document.fullscreenElement) {
              if (appEl.requestFullscreen) appEl.requestFullscreen();
              else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            } else {
              if (document.exitFullscreen) document.exitFullscreen();
            }
            wakeHUD();
          }

          var userScrollingChat = false, chatScrollTimer = null;
          chatBox.addEventListener('touchstart', function(e) {
            e.stopPropagation();
            userScrollingChat = true;
            if (chatScrollTimer) clearTimeout(chatScrollTimer);
          }, {passive: true});
          chatBox.addEventListener('touchend', function(e) {
            e.stopPropagation();
            chatScrollTimer = setTimeout(function() { userScrollingChat = false; }, 5000);
          }, {passive: true});

          function showBadge(txt, ms) {
            badge.textContent = txt;
            badge.style.display = 'block';
            if (ms) setTimeout(function() { badge.style.display = 'none'; }, ms);
          }

          document.getElementById('local-file').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
              var blobUrl = URL.createObjectURL(e.target.files[0]);
              vid.src = blobUrl;
              prevVid.src = blobUrl;
              vid.play();
            }
          });

          function togglePlay() {
            if (vid.paused) vid.play();
            else vid.pause();
            wakeHUD();
          }
          vid.addEventListener('pause', function() {
            bigPlay.textContent = '▶️ تشغيل البث';
            bigPlay.style.display = 'block';
            wakeHUD();
          });

          function toggleUI() {
            uiLayer.classList.toggle('hidden');
            wakeHUD();
          }

          function syncChatTo(targetTime) {
            chatBox.innerHTML = '';
            lastIdx = 0;
            while (lastIdx < EVENTS.length && EVENTS[lastIdx].t < targetTime - 15) lastIdx++;
            while (lastIdx < EVENTS.length && EVENTS[lastIdx].t <= targetTime) {
              addChatRow(EVENTS[lastIdx]);
              lastIdx++;
            }
          }

          var tStartX = 0, tStartY = 0, longPressTimer = null, singleTapTimer = null, isLongPress = false, lastTapTime = 0;
          var isPinching = false, startPinchDist = 0, startPinchScale = 100;

          function getDist(t1, t2) {
            var dx = t1.clientX - t2.clientX, dy = t1.clientY - t2.clientY;
            return Math.hypot(dx, dy);
          }

          touchZone.addEventListener('touchstart', function(e) {
            wakeHUD();
            if (e.touches.length === 2) {
              isPinching = true;
              if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
              startPinchDist = getDist(e.touches[0], e.touches[1]);
              startPinchScale = parseFloat(document.getElementById('s-vid-scale').value) || 100;
              return;
            }
            tStartX = e.changedTouches[0].clientX;
            tStartY = e.changedTouches[0].clientY;
            isLongPress = false;
            longPressTimer = setTimeout(function() {
              if (!isPinching) {
                isLongPress = true;
                vid.playbackRate = 2.0;
                showBadge('⚡ السرعة 2x', 0);
              }
            }, 350);
          }, {passive: true});

          touchZone.addEventListener('touchmove', function(e) {
            if (isPinching && e.touches.length === 2) {
              var curDist = getDist(e.touches[0], e.touches[1]);
              if (startPinchDist > 10) {
                var newScale = Math.round(startPinchScale * (curDist / startPinchDist));
                if (newScale <= 102) {
                  newScale = 100;
                  document.getElementById('s-vid-x').value = 50;
                  document.getElementById('s-vid-y').value = 50;
                }
                newScale = Math.max(100, Math.min(220, newScale));
                document.getElementById('s-vid-scale').value = newScale;
                applySettings();
                showBadge('🔍 زوم: ' + (newScale / 100).toFixed(1) + 'x', 600);
              }
              return;
            }
            var dx = Math.abs(e.changedTouches[0].clientX - tStartX);
            var dy = Math.abs(e.changedTouches[0].clientY - tStartY);
            if (dx > 20 || dy > 20) {
              if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
            }
          }, {passive: true});

          touchZone.addEventListener('touchend', function(e) {
            if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
            if (isPinching) {
              if (e.touches.length < 2) {
                isPinching = false;
                var finalScale = parseFloat(document.getElementById('s-vid-scale').value) || 100;
                if (finalScale <= 103) resetPinchZoom();
              }
              return;
            }
            if (isLongPress) {
              vid.playbackRate = 1.0;
              badge.style.display = 'none';
              isLongPress = false;
              return;
            }
            var endX = e.changedTouches[0].clientX;
            var endY = e.changedTouches[0].clientY;
            var dx = endX - tStartX;
            var dy = Math.abs(endY - tStartY);
            if (Math.abs(dx) > 55 && dy < 90) {
              if (dx > 0) uiLayer.classList.add('hidden');
              else uiLayer.classList.remove('hidden');
              return;
            }
            var now = Date.now();
            if (now - lastTapTime < 280) {
              if (singleTapTimer) { clearTimeout(singleTapTimer); singleTapTimer = null; }
              var w = window.innerWidth;
              if (endX > w / 2) {
                vid.currentTime = Math.min(vid.duration || 99999, vid.currentTime + 5);
                showBadge('⏩ +5 ثوانٍ', 750);
              } else {
                vid.currentTime = Math.max(0, vid.currentTime - 5);
                showBadge('⏪ -5 ثوانٍ', 750);
              }
              syncChatTo(vid.currentTime);
              lastTapTime = 0;
            } else {
              lastTapTime = now;
              singleTapTimer = setTimeout(function() {
                if (settingsPanel.style.display === 'flex') {
                  settingsPanel.style.display = 'none';
                } else {
                  togglePlay();
                }
                singleTapTimer = null;
              }, 280);
            }
          }, {passive: true});

          function colorFor(name) {
            var h = 0;
            for (var i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
            return COLORS[Math.abs(h) % COLORS.length];
          }

          function addChatRow(ev) {
            if (ev.type === 'stats') {
              if (ev.v) { viewerPill.style.display = 'inline-block'; viewerPill.textContent = '👁️ ' + ev.v; }
              if (ev.l) { likesPill.style.display = 'inline-block'; likesPill.textContent = '❤️ ' + ev.l; }
              if (ev.sup && ev.sup.length && !hideSupporters) {
                supBar.style.display = 'flex';
                supBar.innerHTML = ev.sup.map(function(s) { return '<span class="sup-pill">👑 ' + s + '</span>'; }).join('');
              }
              return;
            }
            if (ev.type !== 'chat' && ev.type !== 'gift') return;
            var div = document.createElement('div');
            div.className = ev.type === 'gift' ? 'chat-msg gift-msg' : 'chat-msg';
            var u = ev.u || 'User';
            div.innerHTML = '<div class="chat-avatar" style="background:' + colorFor(u) + '">' + u.charAt(0).toUpperCase() + '</div>' +
              '<div class="chat-content"><span class="chat-user">' + u + ':</span><span class="chat-text">' + (ev.c || '') + '</span></div>';
            chatBox.appendChild(div);
            while (chatBox.children.length > 40) chatBox.removeChild(chatBox.firstChild);
            if (!userScrollingChat) chatBox.scrollTop = chatBox.scrollHeight;
          }

          var lastIdx = 0, lastPrevUpdate = 0;
          vid.addEventListener('loadedmetadata', function() {
            if (vid.duration && isFinite(vid.duration)) {
              totalDuration = vid.duration;
              seek.max = totalDuration;
            }
          });

          function findChatAt(sec) {
            var lo = 0, hi = EVENTS.length - 1, best = null;
            while (lo <= hi) {
              var mid = (lo + hi) >> 1;
              if (EVENTS[mid].t <= sec) {
                if (EVENTS[mid].type === 'chat') best = EVENTS[mid];
                lo = mid + 1;
              } else {
                hi = mid - 1;
              }
            }
            return best ? (best.u + ': ' + best.c) : '';
          }

          seek.addEventListener('input', function() {
            wakeHUD();
            var targetTime = parseFloat(seek.value);
            var maxVal = parseFloat(seek.max) || 1;
            var pct = Math.max(0.12, Math.min(0.88, targetTime / maxVal));
            seekPreview.style.display = 'flex';
            seekPreview.style.left = (pct * 100) + '%';
            prevTime.textContent = fmtHMS(targetTime);
            prevChat.textContent = findChatAt(targetTime);
            var now = Date.now();
            if (now - lastPrevUpdate > 180) {
              lastPrevUpdate = now;
              try { prevVid.currentTime = targetTime; } catch(e){}
            }
            vid.currentTime = targetTime;
            syncChatTo(targetTime);
          });

          seek.addEventListener('change', function() {
            setTimeout(function() { seekPreview.style.display = 'none'; }, 400);
          });
          seek.addEventListener('touchend', function() {
            setTimeout(function() { seekPreview.style.display = 'none'; }, 400);
          });

          vid.addEventListener('timeupdate', function() {
            var cur = vid.currentTime;
            if (cur > 0) bigPlay.style.display = 'none';
            seek.value = cur;
            var dur = (vid.duration && isFinite(vid.duration)) ? vid.duration : totalDuration;
            var rem = Math.max(0, dur - cur);
            timeDisplay.textContent = fmtHMS(cur) + ' / ' + fmtHMS(dur) + ' (-' + fmtHMS(rem) + ')';
            while (lastIdx < EVENTS.length && EVENTS[lastIdx].t <= cur) {
              addChatRow(EVENTS[lastIdx]);
              lastIdx++;
            }
          });
          </script>
          </body>
          </html>"""

          def build_html(video_url, events, out_html_path):
              compacted = compact_events(events)
              out = PLAYER_HTML.replace("__VIDEO_URL__", video_url).replace("__EVENTS_JSON__", json.dumps(compacted, ensure_ascii=False))
              with open(out_html_path, "w", encoding="utf-8") as f:
                  f.write(out)
          UIFILE

          python3 - << 'EOF'
          import os, json, shutil, subprocess
          from ui_builder import parse_srt, parse_ass, build_html

          REPO = os.environ.get("REPO", "adaamrd/tiktok-recorder")
          res = subprocess.run(["gh", "release", "list", "--limit", "15", "--json", "tagName"], capture_output=True, text=True)
          if res.returncode == 0 and res.stdout.strip():
              for item in json.loads(res.stdout):
                  tag = item["tagName"]
                  vres = subprocess.run(["gh", "release", "view", tag, "--json", "assets"], capture_output=True, text=True)
                  if vres.returncode != 0:
                      continue
                  assets = json.loads(vres.stdout).get("assets", [])
                  mp4s = [a for a in assets if a["name"].endswith(".mp4")]
                  if not mp4s:
                      subprocess.run(["gh", "release", "delete", tag, "--cleanup-tag", "-y"], check=False)
                      continue

                  for a in assets:
                      if a["name"].startswith("ytdlp_") and a.get("size", 0) < 5000000:
                          subprocess.run(["gh", "release", "delete-asset", tag, a["name"], "-y"], check=False)

                  clean_mp4s = [a for a in mp4s if a["name"].startswith("stream_")]
                  tk_mp4s = [a for a in mp4s if a["name"].startswith("TK_")]
                  if clean_mp4s and tk_mp4s:
                      for dup in tk_mp4s:
                          subprocess.run(["gh", "release", "delete-asset", tag, dup["name"], "-y"], check=False)
                      mp4s = clean_mp4s

                  mp4s.sort(key=lambda x: x.get("size", 0), reverse=True)
                  best_mp4 = mp4s[0]["name"]

                  shutil.rmtree("tmp_ui", ignore_errors=True)
                  os.makedirs("tmp_ui", exist_ok=True)
                  events = []
                  jsons = [a["name"] for a in assets if a["name"].endswith(".json")]
                  srts = [a["name"] for a in assets if a["name"].endswith(".srt")]
                  asses = [a["name"] for a in assets if a["name"].endswith(".ass")]

                  if jsons:
                      subprocess.run(["gh", "release", "download", tag, "-p", jsons[0], "-D", "tmp_ui", "--clobber"], check=False)
                      jp = os.path.join("tmp_ui", jsons[0])
                      if os.path.exists(jp):
                          try:
                              with open(jp, "r", encoding="utf-8") as f:
                                  events = json.load(f)
                          except Exception:
                              pass
                  if not events and srts:
                      subprocess.run(["gh", "release", "download", tag, "-p", srts[0], "-D", "tmp_ui", "--clobber"], check=False)
                      sp = os.path.join("tmp_ui", srts[0])
