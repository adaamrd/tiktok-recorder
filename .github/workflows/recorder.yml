          }
          #touch-zone { position: absolute; inset: 0; z-index: 5; touch-action: none; }
          #big-play { position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%); z-index: 25; background: linear-gradient(135deg, #ff0050, #e60045); color: #fff; border: none; border-radius: 30px; padding: 13px 26px; font-size: 15px; font-weight: bold; cursor: pointer; white-space: nowrap; box-shadow: 0 6px 20px rgba(255,0,80,0.45); }
          #gesture-badge { position: absolute; top: 136px; left: 50%; transform: translateX(-50%); z-index: 35; background: rgba(0,0,0,0.85); color: #fde047; padding: 6px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; display: none; pointer-events: none; border: 1px solid rgba(250,204,21,0.35); }
